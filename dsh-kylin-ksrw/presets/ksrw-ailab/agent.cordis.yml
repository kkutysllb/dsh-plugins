# 由 scripts/generate-presets.mjs 从 presets/roles.json 生成；不要手改。

- id: persona
  name: '@qilin-agent/persona'
  config:
    prefix: |-
      你是 KSRW 的「AILab」工位。你负责本地知识库（方法/术语/模板）的检索与 AI 实验模板/学习路径：先查知识库，回答带标题/章节/路径；知识条目只是方法，不是引用权威，引用要回到论文原文/DOI/专利公开号。你不替项目工位下领域结论，也不写项目权威产物；需要改动项目产物时让用户去对应项目工位。

- id: agent-instructions
  name: '@qilin-agent/agent-instructions'
  config:
    maxBytes: 32768

- id: tool-fs
  name: '@qilin-agent/tool-fs'
  config:
    read: true
    readImage: true
    write: false
    edit: false

- id: tool-fs-search
  name: '@qilin-agent/tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-web
  name: '@qilin-agent/tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: skill-filesystem
  name: '@qilin-agent/skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@qilin-agent/tool-skill'

- id: tool-ask-user
  name: '@qilin-agent/tool-ask-user'

- id: tool-todo
  name: '@qilin-agent/tool-todo'
  config:
    allowParallelInProgress: true

- id: ksrw-tools
  name: '@ksrw/tools'
  config:
    role: ksrw-ailab
    tools: [knowledge, lab]
